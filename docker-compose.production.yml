name: harbor-support-production

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in Portainer}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in Portainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - serviceops-production-postgres:/var/lib/postgresql/data

  api:
    image: serviceops-api:production
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Portainer}
      WEB_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to an HTTPS origin}
      AGENT_MODE: ${AGENT_MODE:-deterministic}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-deepseek}
      MODEL_API_STYLE: ${MODEL_API_STYLE:-responses}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.deepseek.com}
      MODEL_NAME: ${MODEL_NAME:-deepseek-v4-flash}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-30}
      MODEL_ACK_TIMEOUT_SECONDS: ${MODEL_ACK_TIMEOUT_SECONDS:-0.75}
      MODEL_MAX_RETRIES: ${MODEL_MAX_RETRIES:-1}
      MODEL_REQUESTS_PER_MINUTE: ${MODEL_REQUESTS_PER_MINUTE:-30}
      MODEL_CIRCUIT_FAILURE_THRESHOLD: ${MODEL_CIRCUIT_FAILURE_THRESHOLD:-3}
      MODEL_CIRCUIT_COOLDOWN_SECONDS: ${MODEL_CIRCUIT_COOLDOWN_SECONDS:-60}
      MODEL_FALLBACK_ENABLED: ${MODEL_FALLBACK_ENABLED:-true}
      MODEL_MAX_TURNS: ${MODEL_MAX_TURNS:-8}
      DEMO_MODE_ENABLED: "false"
      API_DOCS_ENABLED: "false"
      SENSITIVE_TRACING_ENABLED: "false"
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-12}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    expose:
      - "8000"

  web:
    image: serviceops-web:production
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    expose:
      - "3000"

  gateway:
    image: serviceops-gateway:production
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    volumes:
      - ${TLS_CERT_PATH:?Set TLS_CERT_PATH to the server certificate path}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_PATH:?Set TLS_KEY_PATH to the server private key path}:/etc/nginx/tls/privkey.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O - https://127.0.0.1/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  serviceops-production-postgres:
