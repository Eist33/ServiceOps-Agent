name: harbor-support

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: serviceops
      POSTGRES_USER: serviceops
      POSTGRES_PASSWORD: serviceops
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serviceops -d serviceops"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - serviceops-postgres:/var/lib/postgresql/data

  api:
    image: serviceops-api:20260908-4780f38
    restart: unless-stopped
    environment:
      APP_ENV: demo
      DATABASE_URL: postgresql+psycopg://serviceops:serviceops@postgres:5432/serviceops
      WEB_ORIGIN: ${WEB_ORIGIN:-http://101.35.149.171:13000}
      AGENT_MODE: ${AGENT_MODE:-deterministic}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-deepseek}
      MODEL_API_STYLE: ${MODEL_API_STYLE:-responses}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.deepseek.com}
      MODEL_NAME: ${MODEL_NAME:-deepseek-v4-flash}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-30}
      MODEL_ACK_TIMEOUT_SECONDS: ${MODEL_ACK_TIMEOUT_SECONDS:-0.75}
      MODEL_MAX_RETRIES: ${MODEL_MAX_RETRIES:-1}
      MODEL_REQUESTS_PER_MINUTE: ${MODEL_REQUESTS_PER_MINUTE:-30}
      MODEL_CIRCUIT_FAILURE_THRESHOLD: ${MODEL_CIRCUIT_FAILURE_THRESHOLD:-3}
      MODEL_CIRCUIT_COOLDOWN_SECONDS: ${MODEL_CIRCUIT_COOLDOWN_SECONDS:-60}
      MODEL_FALLBACK_ENABLED: ${MODEL_FALLBACK_ENABLED:-true}
      MODEL_MAX_TURNS: ${MODEL_MAX_TURNS:-8}
      DEMO_MODE_ENABLED: "true"
      API_DOCS_ENABLED: "true"
      DEMO_LOGIN_PASSWORD: ${DEMO_LOGIN_PASSWORD:?Set DEMO_LOGIN_PASSWORD in Portainer Stack environment}
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-12}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SENSITIVE_TRACING_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "18080:8000"

  web:
    image: serviceops-web:20260908-4780f38
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "13000:3000"

volumes:
  serviceops-postgres:
